```yaml
name: Terraform AWS IAM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 5. Validate configuration
      - name: Terraform Validate
        run: terraform validate

      # 6. Check formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 7. Verify AWS credentials
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 8. Check existing Terraform state
      - name: Check Terraform State Before Apply
        run: terraform state list

      # 9. Generate execution plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 10. Create IAM resources
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # 11. Verify resources in Terraform state
      - name: Check Terraform State After Apply
        run: terraform state list

      # 12. Display IAM outputs
      - name: Terraform Output
        run: terraform output
```
