name: Terraform AWS VPC

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Import Existing S3 Bucket
        run: |
          if terraform state list | grep -qx 'aws_s3_bucket.my_bucket'; then
            echo "S3 bucket is already tracked in Terraform state."
          else
            terraform import aws_s3_bucket.my_bucket terraform-github-s3-testing-01-sep-09
          fi

      - name: Terraform Plan
        run: terraform plan
